<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eventify">
  <!-- Calendar with check (favicon) -->
  <defs>
    <clipPath id="pageClip">
      <rect x="8" y="10" width="48" height="48" rx="8" />
    </clipPath>
  </defs>

  <!-- page base -->
  <rect x="8" y="10" width="48" height="48" rx="8" fill="#F3F4F6" stroke="#111827" stroke-width="4" />

  <!-- top header -->
  <g clip-path="url(#pageClip)">
    <rect x="8" y="10" width="48" height="16" fill="#EF4444" />
  </g>

  <!-- rings -->
  <rect x="18" y="6" width="8" height="18" rx="4" fill="#FACC15" stroke="#111827" stroke-width="4" />
  <rect x="28" y="6" width="8" height="18" rx="4" fill="#FACC15" stroke="#111827" stroke-width="4" />
  <rect x="38" y="6" width="8" height="18" rx="4" fill="#FACC15" stroke="#111827" stroke-width="4" />

  <!-- subtle page fold shadow (right) -->
  <path d="M52 26 v28" stroke="#111827" stroke-width="4" stroke-linecap="round" opacity="0.55" />

  <!-- check badge -->
  <circle cx="32" cy="40" r="14" fill="#93C5FD" stroke="#111827" stroke-width="4" />
  <path d="M24.5 40.5l5.2 5.2 11-12" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
